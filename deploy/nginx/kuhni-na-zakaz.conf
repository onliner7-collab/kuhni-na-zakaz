server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_redirect http://127.0.0.1:__PORT__/ http://__DOMAIN__/;
        proxy_redirect https://127.0.0.1:__PORT__/ https://__DOMAIN__/;
        proxy_redirect http://localhost:__PORT__/ http://__DOMAIN__/;
        proxy_redirect https://localhost:__PORT__/ https://__DOMAIN__/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name www.__DOMAIN__;

    # Keep a single canonical domain.
    return 301 https://__DOMAIN__$request_uri;
}
