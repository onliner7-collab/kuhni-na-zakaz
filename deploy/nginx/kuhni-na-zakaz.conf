upstream kuhni_na_zakaz_app {
    server 127.0.0.1:__PORT__;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__DOMAIN__;

    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate __SSL_CERTIFICATE__;
    ssl_certificate_key __SSL_CERTIFICATE_KEY__;

    client_max_body_size 20m;

    location = /robots.txt {
        root __APP_DIR__/artifacts/kuhni-na-zakaz/public;
        default_type text/plain;
        add_header X-Robots-Source static always;
        try_files /robots.txt @robots_app;
    }

    location @robots_app {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 @robots_static_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @robots_static_fallback {
        internal;
        root __APP_DIR__/artifacts/kuhni-na-zakaz/public;
        default_type text/plain;
        add_header X-Robots-Fallback static always;
        try_files /robots.txt =503;
    }

    location = /sitemap.xml {
        root __APP_DIR__/artifacts/kuhni-na-zakaz/public;
        default_type application/xml;
        add_header X-Sitemap-Source static always;
        try_files /sitemap-static.xml @sitemap_app;
    }

    location @sitemap_app {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_intercept_errors on;
        error_page 500 502 503 504 =200 @sitemap_static_fallback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location @sitemap_static_fallback {
        internal;
        root __APP_DIR__/artifacts/kuhni-na-zakaz/public;
        default_type application/xml;
        add_header X-Sitemap-Fallback static always;
        try_files /sitemap-static.xml =503;
    }

    location ^~ /_next/static/ {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /_next/image {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /uploads/ {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ^~ /images/ {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://kuhni_na_zakaz_app;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
