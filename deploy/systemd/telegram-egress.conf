[Service]
# Telegram lead notifications require outbound HTTPS to api.telegram.org.
# This resets the localhost-only network lockdown drop-in.
IPAddressDeny=
IPAddressAllow=
# Timeweb DNS can resolve api.telegram.org to IPv6 first while IPv6 egress times out.
# Keep Node fetch on the reachable IPv4 route for Telegram and SMTP-style web APIs.
Environment=NODE_OPTIONS=--dns-result-order=ipv4first
